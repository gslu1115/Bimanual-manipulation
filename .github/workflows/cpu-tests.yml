name: CPU tests

on:
  push:
    branches: [linux-based]
  pull_request:
    branches: [linux-based]

permissions:
  contents: read

concurrency:
  group: cpu-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    name: Ubuntu / Python 3.12
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, resolved 2026-10-12
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, resolved 2026-10-12
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements-cpu.txt
      - name: Install CPU test dependencies
        run: >-
          python -m pip install --only-binary=:all: -r tests/requirements-cpu.txt
      - name: Core CPU regression
        run: >-
          python -m unittest -v
          tests.test_runtime_paths
          tests.test_interactive_failure
          tests.test_camera_system
          tests.test_policy_observation.PolicyTests.test_packet_depth_is_float32_and_no_privileged_fields
          tests.test_current_fragments
          tests.test_preclose_target
          tests.test_grasp_constrained_carry
          tests.test_small_carton_center
          tests.test_graspgen_execution
          tests.test_graspgen_pair
          tests.test_conveyor_slot_reservations
      - name: Validate scene configuration without starting Isaac
        run: python -m workstation --mode scene --validate-only
